<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Profile - TAG</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --card-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
        --accent: #ffb6d9;
        --surface: #2f2f33;
        --surface-soft: #232326;
        --border: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --muted: #a1a1aa;
      }

      body {
        font-family: -apple-system, "SF Pro Display", system-ui, sans-serif;
        background:
          radial-gradient(circle at top, rgba(255, 182, 217, 0.12), transparent 30%),
          #09090b;
        color: var(--text);
        min-height: 100vh;
        scrollbar-gutter: stable;
      }

      .app {
        max-width: 420px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 24px 20px 110px;
      }

      .profile-shell {
        position: relative;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
        border: 1px solid var(--border);
        border-radius: 28px;
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }

      .profile-content {
        position: relative;
        z-index: 1;
        padding: 28px 20px 20px;
      }

      .secret-eye-btn {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 28px;
        height: 24px;
        border: none;
        background: transparent;
        opacity: 0.16;
        cursor: pointer;
        padding: 0;
        z-index: 20;
        filter: blur(0.35px);
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .secret-eye-btn:hover,
      .secret-eye-btn.unlocked {
        opacity: 0.2;
        transform: scale(1.04);
      }

      .secret-eye-btn::before {
        content: "";
        position: absolute;
        left: 1.5px;
        top: 2px;
        width: 0;
        height: 0;
        border-left: 10.5px solid transparent;
        border-right: 10.5px solid transparent;
        border-bottom: 18px solid rgba(255, 182, 217, 0.9);
        filter: drop-shadow(0 0 2px rgba(255, 32, 168, 0.22));
      }

      .secret-eye-btn::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 5px;
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 13.5px solid #232326;
      }

      .secret-eye-shape {
        position: absolute;
        left: 7px;
        top: 12px;
        width: 10.5px;
        height: 5.5px;
        border: 1.1px solid rgba(255, 182, 217, 0.96);
        border-radius: 50% 50% 50% 50% / 70% 70% 70% 70%;
        box-shadow: none;
        transform: rotate(-2deg);
        z-index: 2;
      }

      .secret-eye-pupil {
        position: absolute;
        top: 14.8px;
        left: 50%;
        width: 3.2px;
        height: 3.2px;
        border-radius: 50%;
        background: rgba(255, 182, 217, 1);
        box-shadow: 0 0 3px rgba(255, 32, 168, 0.45);
        transform: translate(-50%, -50%);
        z-index: 3;
      }

      .profile-bg-logo {
        position: absolute;
        top: 17px;
        right: 16px;
        width: 28px;
        height: 24px;
        object-fit: contain;
        opacity: 0.16;
        filter: blur(0.35px);
        pointer-events: none;
        z-index: 0;
      }

      .secret-flash {
        position: fixed;
        inset: 0;
        z-index: 5000;
        pointer-events: none;
        opacity: 0;
        background:
          radial-gradient(circle at center, rgba(255, 255, 255, 0.96) 0%, rgba(255, 57, 181, 0.88) 22%, rgba(255, 0, 153, 0.42) 54%, transparent 76%);
      }

      .secret-flash.active {
        animation: secretFlash 1s ease-out forwards;
      }

      @keyframes secretFlash {
        0% { opacity: 0; }
        16% { opacity: 1; }
        100% { opacity: 0; }
      }

      .profile-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 8px 0 20px;
      }

      .avatar-upload {
        position: relative;
        display: block;
        cursor: pointer;
      }

      .profile-avatar {
        width: 156px;
        height: 156px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
      }

      .upload-overlay {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 13px;
        line-height: 1.35;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .avatar-upload:hover .upload-overlay {
        opacity: 1;
      }

      .profile-info {
        width: 100%;
        text-align: center;
      }

      .profile-nickname {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .nickname-edit,
      .photo-input {
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: var(--surface);
        color: var(--text);
        border-radius: 16px;
        padding: 14px 16px;
        font-size: 16px;
      }

      .nickname-edit:focus,
      .photo-input:focus {
        outline: none;
        border-color: rgba(255, 182, 217, 0.8);
        box-shadow: 0 0 0 4px rgba(255, 182, 217, 0.12);
      }

      .favorites-section,
      .profile-section {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 16px;
        margin-top: 16px;
      }

      .favorites-section h3,
      .profile-section h3 {
        font-size: 15px;
        margin-bottom: 10px;
      }

      .favorites-hint,
      .section-hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .favorites-list {
        display: grid;
        gap: 10px;
      }

      .favorite-item {
        background: var(--surface-soft);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .favorite-item span {
        flex: 1;
        cursor: pointer;
      }

      .favorite-item button {
        border: none;
        background: transparent;
        color: #ffd866;
        font-size: 18px;
        cursor: pointer;
      }

      .modal-actions {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }

      .modal-actions-row {
        display: flex;
        gap: 12px;
      }

      .btn {
        flex: 1 1 auto;
        min-height: 48px;
        border: none;
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn.primary {
        background: var(--accent);
        color: #fff;
      }

      .btn.secondary {
        background: #3b3b40;
        color: #fff;
      }

      .btn.danger {
        background: #6f1d2d;
        color: #fff;
      }

      .status-text {
        min-height: 20px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .status-text.error {
        color: #fca5a5;
      }

      .status-text.success {
        color: #86efac;
      }

      .bottom-nav {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 0;
        width: 100%;
        max-width: 420px;
        background: rgba(20, 20, 23, 0.96);
        backdrop-filter: blur(14px);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-around;
        padding: 10px 0;
        z-index: 1000;
      }

      .nav-button {
        background: none;
        border: none;
        color: #888;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 6px 10px;
        border-radius: 10px;
      }

      .nav-button.active {
        color: var(--accent);
      }

      .nav-icon {
        font-size: 18px;
      }

      @media (max-width: 480px) {
        .app {
          padding-inline: 14px;
        }

        .profile-content {
          padding-inline: 16px;
        }

        .bottom-nav {
          max-width: 100%;
        }

        .modal-actions-row {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body
    data-user-id="{{ current_user.id }}"
    data-user-name="{{ current_user.nickname }}"
  >
    <div class="app">
      <section class="profile-shell">
        <button id="secretEyeBtn" class="secret-eye-btn" type="button" aria-label="Unlock hidden locations">
          <span class="secret-eye-shape"></span>
          <span class="secret-eye-pupil"></span>
        </button>
        <img
          src="/static/photos/tag-mark-transparent-crop.png"
          alt=""
          class="profile-bg-logo"
          aria-hidden="true"
        />
        <div class="profile-content">
          <div class="profile-card">
            <label for="avatarInput" class="avatar-upload">
              <img
                id="profileAvatar"
                src="{{ current_user.avatar or ('https://via.placeholder.com/120x120/fff5f5/ffd700?text=' ~ current_user.nickname[0].upper()) }}"
                alt="{{ current_user.nickname }}"
                class="profile-avatar"
              />
              <div class="upload-overlay">Tap to change<br />avatar</div>
            </label>
            <input
              type="file"
              id="avatarInput"
              accept="image/*"
              style="display: none"
            />

            <div class="profile-info">
              <div class="profile-nickname" id="profileNickname">
                {{ current_user.nickname }}
              </div>
              <input
                type="text"
                id="nicknameInput"
                class="nickname-edit"
                placeholder="New nickname"
                value="{{ current_user.nickname }}"
              />
            </div>
          </div>

          <div class="favorites-section">
            <h3>Favorite locations</h3>
            <div id="favoritesList" class="favorites-list">
              <p class="favorites-hint">Loading favorites...</p>
            </div>
          </div>

          <div class="profile-section">
            <h3>Photos</h3>
            <input
              type="file"
              id="locationPhotos"
              class="photo-input"
              accept="image/*"
              multiple
            />
            <p class="section-hint" style="margin-top: 10px">
              You can attach a few photos to help moderation.
            </p>
          </div>

          <div class="modal-actions">
            <div class="modal-actions-row">
              <button id="saveProfile" class="btn primary">Save</button>
              <button
                id="logoutBtn"
                class="btn secondary"
                type="button"
                onclick="window.location.href='/logout'"
              >
                Logout
              </button>
            </div>
            <div class="modal-actions-row">
              <button id="deleteAccountBtn" class="btn danger" type="button">
                Delete account
              </button>
            </div>
          </div>

          <div id="statusText" class="status-text"></div>
        </div>
      </section>
    </div>

    <div id="secretFlash" class="secret-flash"></div>

    <div class="bottom-nav">
      <button id="chatsNavBtn" class="nav-button">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Chats</span>
      </button>
      <button id="feedNavBtn" class="nav-button">
        <span class="nav-icon">🌍</span>
        <span class="nav-label">Feed</span>
      </button>
      <button id="mapNavBtn" class="nav-button">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">Map</span>
      </button>
      <button id="profileNavBtn" class="nav-button active">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profile</span>
      </button>
    </div>

    <script>
      const profileAvatar = document.getElementById("profileAvatar");
      const profileNickname = document.getElementById("profileNickname");
      const nicknameInput = document.getElementById("nicknameInput");
      const avatarInput = document.getElementById("avatarInput");
      const favoritesList = document.getElementById("favoritesList");
      const saveProfile = document.getElementById("saveProfile");
      const deleteAccountBtn = document.getElementById("deleteAccountBtn");
      const statusText = document.getElementById("statusText");
      const secretEyeBtn = document.getElementById("secretEyeBtn");
      const secretFlash = document.getElementById("secretFlash");

      let currentAvatar = profileAvatar.src;
      let favoritesSet = new Set();
      let secretUnlocked = localStorage.getItem("secretLocationsUnlocked") === "true";

      if (secretUnlocked) {
        secretEyeBtn.classList.add("unlocked");
      }

      secretEyeBtn.addEventListener("click", () => {
        secretUnlocked = !secretUnlocked;
        localStorage.setItem("secretLocationsUnlocked", String(secretUnlocked));
        secretEyeBtn.classList.toggle("unlocked", secretUnlocked);
        secretFlash.classList.remove("active");
        void secretFlash.offsetWidth;
        secretFlash.classList.add("active");
        window.setTimeout(() => secretFlash.classList.remove("active"), 1000);
      });

      function setStatus(message, type = "") {
        statusText.textContent = message;
        statusText.className = `status-text${type ? ` ${type}` : ""}`;
      }

      async function loadFavorites() {
        try {
          const response = await fetch("/api/favorite_locations");
          if (!response.ok) {
            throw new Error("favorites");
          }
          const data = await response.json();
          favoritesSet = new Set(Array.isArray(data) ? data : []);
          renderFavorites();
        } catch (error) {
          favoritesList.innerHTML =
            '<p class="favorites-hint">Could not load favorites right now.</p>';
        }
      }

      function renderFavorites() {
        if (!favoritesSet.size) {
          favoritesList.innerHTML =
            '<p class="favorites-hint">No favorite locations yet.</p>';
          return;
        }

        favoritesList.innerHTML = "";
        favoritesSet.forEach((title) => {
          const item = document.createElement("div");
          item.className = "favorite-item";

          const label = document.createElement("span");
          label.textContent = title;
          label.addEventListener("click", () => {
            window.location.href = `/?favorite=${encodeURIComponent(title)}`;
          });

          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.textContent = "★";
          removeButton.title = "Remove from favorites";
          removeButton.addEventListener("click", async (event) => {
            event.stopPropagation();
            await fetch("/api/favorite_locations", {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title }),
            });
            favoritesSet.delete(title);
            renderFavorites();
          });

          item.appendChild(label);
          item.appendChild(removeButton);
          favoritesList.appendChild(item);
        });
      }

      avatarInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) {
          return;
        }

        const reader = new FileReader();
        reader.onload = (loadEvent) => {
          const image = new Image();
          image.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = 120;
            canvas.height = 120;
            const ctx = canvas.getContext("2d");

            ctx.clearRect(0, 0, 120, 120);
            ctx.beginPath();
            ctx.arc(60, 60, 60, 0, Math.PI * 2);
            ctx.clip();
            ctx.drawImage(image, 0, 0, 120, 120);

            currentAvatar = canvas.toDataURL("image/jpeg", 0.9);
            profileAvatar.src = currentAvatar;
          };
          image.src = loadEvent.target.result;
        };
        reader.readAsDataURL(file);
      });

      saveProfile.addEventListener("click", async () => {
        const newNickname = nicknameInput.value.trim();
        if (!newNickname) {
          setStatus("Nickname cannot be empty.", "error");
          return;
        }

        setStatus("Saving...");

        try {
          const response = await fetch("/update-profile", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nickname: newNickname,
              avatar: currentAvatar,
            }),
          });
          const data = await response.json();

          if (!response.ok || !data.success) {
            setStatus(data.error || "Could not save profile.", "error");
            return;
          }

          profileNickname.textContent = data.nickname || newNickname;
          nicknameInput.value = data.nickname || newNickname;
          if (data.avatar) {
            currentAvatar = data.avatar;
            profileAvatar.src = data.avatar;
          }
          setStatus("Profile saved.", "success");
        } catch (error) {
          setStatus("Network error while saving profile.", "error");
        }
      });

      deleteAccountBtn.addEventListener("click", () => {
        if (
          confirm(
            "Are you sure you want to delete your account? This action cannot be undone.",
          )
        ) {
          fetch("/delete-account", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
          }).then(() => {
            window.location.href = "/register";
          });
        }
      });

      document.getElementById("chatsNavBtn").onclick = () => {
        window.location.href = "/chats";
      };
      document.getElementById("feedNavBtn").onclick = () => {
        window.location.href = "/";
      };
      document.getElementById("mapNavBtn").onclick = () => {
        window.location.href = "/?view=map";
      };
      document.getElementById("profileNavBtn").onclick = () => {};

      loadFavorites();
    </script>
  </body>
</html>
